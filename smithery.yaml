name: etherscan-mcp
version: 1.0.0
description: Model Context Protocol server for Etherscan API integration with multichain support

# Build configuration
build:
  command: npm install && npm run build
  output: dist

# Runtime configuration
runtime: typescript

# Start command
startCommand:
  type: stdio
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: config.env
    })

# Environment variables required from users
env:
  ETHERSCAN_API_KEY: ""

# Metadata
metadata:
  author: ""
  license: MIT
  repository: ""
  keywords:
    - mcp
    - model-context-protocol
    - etherscan
    - ethereum
    - blockchain
    - multichain

